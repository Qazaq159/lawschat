version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: DockerfileBot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379
      - DOCX_PATH=./insurance_laws
      - MODEL_NAME=gemini-2.5-flash
      - REBUILD_VECTORSTORE=${REBUILD_VECTORSTORE:-false}
    volumes:
      - ./insurance_laws:/app/insurance_laws
      - ./knowledge_base:/app/knowledge_base
      - ./insurance_law_db:/app/insurance_law_db
      - ./bot.log:/app/bot.log
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: DockerfileWeb
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./insurance_laws:/app/insurance_laws
      - ./knowledge_base:/app/knowledge_base
      - ./insurance_law_db:/app/insurance_law_db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
